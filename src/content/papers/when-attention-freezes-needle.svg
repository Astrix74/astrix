<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
<title id="t">Weight on a needle key as the context grows, under three logit scalings</title>
<desc id="d">Left: a soft head with a well-separated needle; the log-n scaling keeps most of the needle's weight while the others fade. Right: a sharp head whose needle is only marginally above the distractors; every scaling fails once a distractor outscores the needle.</desc>
