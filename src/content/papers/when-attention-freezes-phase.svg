<title id="t">Attention entropy, as a share of its maximum, against the scaled score spread x</title>
<desc id="d">Four context lengths and the infinite-length limit 1 − x². All agree up to x = 0.5; beyond it, finite lengths stay far more diffuse than the limit, which freezes at x = 1.</desc>
