  .dot { stroke: #fbfaf7; stroke-width: 2; }
  .limit { stroke: #8a867c; }
  .o1 { stroke: #86b6ef; } .o2 { stroke: #3987e5; } .o3 { stroke: #1c5cab; } .o4 { stroke: #0d366b; }
